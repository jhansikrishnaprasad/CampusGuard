# Builds CampusGuard.exe on a GitHub-hosted WINDOWS machine, runs its own self-test, and publishes the result.
# Run it: GitHub -> Actions -> "Build Windows executable" -> Run workflow   (or push a tag such as v1.4.0 to also create a Release)
name: Build Windows executable
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build CampusGuard.exe (PyInstaller)
        run: python -m PyInstaller CampusGuard.spec --noconfirm --clean
      - name: Self-test the packaged executable (starts it, probes the API and UI, stops it)
        run: |
          $env:CAMPUS_SELFTEST_HOME = Join-Path $env:RUNNER_TEMP "campusguard_selftest"
          .\dist\CampusGuard\CampusGuard.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "CampusGuard.exe self-test FAILED (exit $LASTEXITCODE)" }
      - name: Package
        run: Compress-Archive -Path dist\CampusGuard -DestinationPath CampusGuard_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CampusGuard-Windows
          path: CampusGuard_Windows.zip
      - name: Attach to the GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CampusGuard_Windows.zip
          generate_release_notes: true
