<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusGuard Analytics</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-card">
    <div class="brand big"><span class="logo"></span><b>CampusGuard</b><small>Analytics</small></div>
    <h2>Administrator sign-in</h2>
    <p class="muted">AI findings are predictions that need human review. Authorised staff only.</p>
    <div class="field"><label>Username</label><input id="lu" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div>
    <div id="lerr" class="alert err hidden"></div>
    <button class="btn primary w100" id="lbtn">Sign in</button>
  </div>
</div>
<div id="app" class="app hidden">
  <aside class="side" id="side">
    <div class="brand"><span class="logo"></span><div><b>CampusGuard</b><small>Video Analytics</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="user"><span id="uname"></span><small id="urole"></small></div>
      <button class="btn ghost sm" id="theme">Theme</button>
      <button class="btn ghost sm" id="logout">Sign out</button>
      <button class="btn ghost sm hidden" id="quit" title="Stop the local CampusGuard server">Quit CampusGuard</button>
    </div>
  </aside>
  <main class="main">
    <header class="top"><button class="btn ghost sm menu" id="menu">Menu</button><h1 id="title"></h1><div id="topact"></div></header>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-body" id="modalbody"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="notify" class="notify-stack" aria-live="polite"></div>
<script src="js/app.js"></script>
</body></html>
